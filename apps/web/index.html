<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Távola</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Sem piscar o tema errado: antes de qualquer JS, o fundo da página já é o do tema escolhido.
         Os valores de `background` abaixo são os `fundo` de apps/web/src/tema/temas.ts (um teste confere). -->
    <style>
      html { background: #0C0C0C; }
      html[data-tema="grimorio"] { background: #0C0C0C; }
      html[data-tema="escuro"] { background: #0F1115; }
      html[data-tema="claro"] { background: #EFEBE4; }
      html[data-tema="edgerunner"] { background: #0B0912; }
      html[data-tema="vampiro"] { background: #0A0405; }
      html[data-tema="licantropo"] { background: #0C0E11; }
      html[data-tema="taverna"] { background: #100B07; }
      html[data-tema="forja"] { background: #0D0C0B; }
      html[data-tema="paladino"] { background: #0A0E1D; }
      html[data-tema="druida"] { background: #0A110B; }
      html[data-tema="leviata"] { background: #06111A; }
      html[data-tema="arcana"] { background: #0E0917; }
      html[data-tema="elfico"] { background: #D9E7D5; }
      html[data-tema="celestial"] { background: #DCE7F6; }
    </style>
    <script>
      let tema = null;
      try {
        tema = localStorage.getItem("tabletop:pref:tema");
      } catch {
        tema = null;
      }
      if (["grimorio","escuro","claro","edgerunner","vampiro","licantropo","taverna","forja","paladino","druida","leviata","arcana","elfico","celestial"].indexOf(tema) !== -1) {
        document.documentElement.setAttribute("data-tema", tema);
      }
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
