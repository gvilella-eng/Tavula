<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Távola</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Sem piscar o tema errado: antes de qualquer JS, o fundo da página já é o do tema escolhido.
         Os valores de `background` abaixo são os `fundo` de apps/web/src/tema/temas.ts (um teste confere). -->
    <style>
      html { background: #0C0C0C; }
      html[data-tema="grimorio"] { background: #0C0C0C; }
      html[data-tema="taverna"] { background: #0E0B09; }
      html[data-tema="forja"] { background: #0E0E0D; }
      html[data-tema="licantropo"] { background: #0D1013; }
      html[data-tema="paladino"] { background: #0A0E1A; }
      html[data-tema="druida"] { background: #0B110E; }
      html[data-tema="leviata"] { background: #091315; }
      html[data-tema="vampiro"] { background: #120B0D; }
      html[data-tema="arcana"] { background: #0F0C14; }
      html[data-tema="escuro"] { background: #0F1115; }
      html[data-tema="claro"] { background: #EFEBE4; }
    </style>
    <script>
      let tema = null;
      try {
        tema = localStorage.getItem("tabletop:pref:tema");
      } catch {
        tema = null;
      }
      if (["grimorio","taverna","forja","licantropo","paladino","druida","leviata","vampiro","arcana","escuro","claro"].indexOf(tema) !== -1) {
        document.documentElement.setAttribute("data-tema", tema);
      }
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
